name: SCK ITT CI - Full-Stack Regression & Automated Test Suite

on:
  push:
    branches:
      - main
      - ui-redesign
  pull_request:
    branches:
      - main
      - ui-redesign
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend JUnit 5 & Spring Boot Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw || true

      - name: Build and Run Backend JUnit 5 Tests
        run: mvn test -B --no-transfer-progress

      - name: Archive Test Results (Surefire Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 14

  frontend-typecheck:
    name: Frontend TypeScript Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --prefer-offline

      - name: Run TypeScript Strict Check
        run: npx tsc --noEmit

      - name: Run Available Frontend Tests
        run: npm test --if-present

