spring:
  application:
    name: smart-itt-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: false

security:
  api-key: smart-itt-test-api-key
  require-api-key: false

jwt:
  secret: smartitt-test-jwt-secret-key-32-bytes-minimum-length-2026!
  expiration: 86400000
  refresh-expiration: 604800000

app:
  jwt:
    secret: smartitt-test-jwt-secret-key-32-bytes-minimum-length-2026!
  upload:
    dir: target/test-uploads
  photos:
    retention-months: 0

admin:
  bootstrap:
    username: ADMIN
    email: admin@smartitt.lk
    password: Admin@123
    name: System Administrator

