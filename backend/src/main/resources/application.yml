spring:
  application:
    name: smart-itt-backend
  profiles:
    active: dev

---
# Development Profile (in-memory H2 with PostgreSQL compatibility)
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:smartitt;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

---
# Production Profile (PostgreSQL with Flyway migrations)
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartitt}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: SmartIttHikariPoolProd

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  h2:
    console:
      enabled: false

---
# Common Configuration
security:
  api-key: ${API_KEY:smart-itt-sec-key-prod-2026}
  require-api-key: ${REQUIRE_API_KEY:false}

jwt:
  secret: ${JWT_SECRET:smartitt-jwt-256bit-secure-token-production-fleet-key-2026-auth}
  expiration: ${JWT_EXPIRATION_MS:86400000} # 24 hours in ms
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days in ms

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

server:
  port: ${PORT:8080}

